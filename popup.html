<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 340px;
      padding: 0;
      background: #0d0d0f;
      color: #f5f5f5;
      overflow-x: hidden;
    }

    .header {
      background: linear-gradient(135deg, #1a1a1f 0%, #0d0d0f 100%);
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(255, 169, 77, 0.15);
      position: relative;
    }

    .header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #ff9a4d, #ffb347, #ff6b35);
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .title-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #ff9a4d 0%, #ff6b35 100%);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      box-shadow: 0 2px 8px rgba(255, 107, 53, 0.3);
    }

    h1 {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(90deg, #ff9a4d, #ffb347);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.3px;
    }

    .lang-toggle {
      display: flex;
      background: #1a1a1f;
      border-radius: 6px;
      padding: 3px;
      gap: 2px;
    }

    .lang-btn {
      padding: 4px 9px;
      font-size: 10px;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: transparent;
      color: #555;
    }

    .lang-btn.active {
      background: linear-gradient(135deg, #ff9a4d 0%, #ff6b35 100%);
      color: #fff;
      box-shadow: 0 2px 6px rgba(255, 107, 53, 0.3);
    }

    .lang-btn:not(.active):hover {
      color: #888;
    }

    .tagline {
      font-size: 10px;
      color: #666;
      margin-left: 40px;
    }

    .content {
      padding: 14px;
    }

    .status-card {
      background: linear-gradient(145deg, #1a1a1f 0%, #151518 100%);
      border: 1px solid rgba(255, 169, 77, 0.1);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .status-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #333;
      transition: all 0.3s ease;
    }

    .status-dot.active {
      background: #4ade80;
      box-shadow: 0 0 8px rgba(74, 222, 128, 0.5);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-text {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .toggle-title {
      font-size: 13px;
      font-weight: 600;
      color: #f5f5f5;
    }

    .toggle-desc {
      font-size: 10px;
      color: #555;
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 26px;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #2a2a2f;
      border-radius: 26px;
      transition: 0.3s;
      border: 1px solid #333;
    }

    .toggle-slider::before {
      position: absolute;
      content: '';
      height: 20px;
      width: 20px;
      left: 2px;
      bottom: 2px;
      background: #555;
      border-radius: 50%;
      transition: 0.3s;
    }

    .toggle input:checked + .toggle-slider {
      background: linear-gradient(135deg, #ff9a4d 0%, #ff6b35 100%);
      border-color: #ff9a4d;
      box-shadow: 0 0 12px rgba(255, 107, 53, 0.3);
    }

    .toggle input:checked + .toggle-slider::before {
      transform: translateX(18px);
      background: #fff;
    }

    .stats-card {
      background: linear-gradient(145deg, #1a1a1f 0%, #151518 100%);
      border: 1px solid rgba(255, 169, 77, 0.1);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .stats-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .stats-title {
      font-size: 11px;
      color: #ff9a4d;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .total-badge {
      background: rgba(255, 169, 77, 0.15);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      color: #ff9a4d;
      font-weight: 600;
    }

    .total-badge span {
      font-size: 13px;
    }

    .btn-clear-all {
      background: transparent;
      border: 1px solid #333;
      color: #555;
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-clear-all:hover {
      border-color: #ff6b35;
      color: #ff6b35;
    }

    .channel-list {
      max-height: 200px;
      overflow-y: auto;
    }

    .channel-list::-webkit-scrollbar {
      width: 4px;
    }

    .channel-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .channel-list::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 2px;
    }

    .channel-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 8px;
      margin-bottom: 6px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .channel-item:last-child {
      margin-bottom: 0;
    }

    .channel-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .channel-name {
      font-size: 13px;
      color: #ccc;
      font-weight: 500;
      text-decoration: none;
    }

    .channel-name:hover {
      color: #ff9a4d;
    }

    .channel-points {
      font-size: 10px;
      color: #555;
    }

    .channel-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .channel-count {
      font-size: 12px;
      color: #888;
    }

    .channel-count span {
      color: #ff9a4d;
      font-weight: 600;
    }

    .btn-clear {
      background: rgba(255, 77, 77, 0.1);
      border: 1px solid rgba(255, 77, 77, 0.3);
      color: #ff6b6b;
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-clear:hover {
      background: rgba(255, 77, 77, 0.2);
      border-color: #ff6b6b;
    }

    .no-data {
      text-align: center;
      padding: 24px;
      color: #444;
      font-size: 12px;
    }

    .footer {
      padding: 12px 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-text {
      font-size: 10px;
      color: #444;
    }

    .footer-text span {
      color: #ff9a4d;
    }

    .version {
      font-size: 9px;
      color: #333;
      background: #1a1a1f;
      padding: 3px 7px;
      border-radius: 4px;
    }

    .footer-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-settings {
      background: transparent;
      border: none;
      font-size: 14px;
      cursor: pointer;
      padding: 2px;
      opacity: 0.5;
      transition: opacity 0.2s;
    }

    .btn-settings:hover {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-row">
      <div class="title-left">
        <div class="logo">🦊</div>
        <h1>Twitch Auto Claimer</h1>
      </div>
      <div class="lang-toggle">
        <button class="lang-btn" data-lang="zh">中</button>
        <button class="lang-btn active" data-lang="en">EN</button>
      </div>
    </div>
    <p class="tagline" data-i18n="tagline">Auto claim Twitch rewards</p>
  </div>

  <div class="content">
    <div class="status-card">
      <div class="status-header">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText" data-i18n="status_waiting">Waiting</span>
      </div>
      <div class="toggle-row">
        <div class="toggle-label">
          <span class="toggle-title" data-i18n="toggle_title">Auto-claim</span>
          <span class="toggle-desc" data-i18n="toggle_desc">Automatically click when reward appears</span>
        </div>
        <label class="toggle">
          <input type="checkbox" id="toggleSwitch" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div class="stats-card">
      <div class="stats-header">
        <span class="stats-title" data-i18n="channel_stats_title">Channel Stats</span>
        <div class="header-actions">
          <div class="total-badge">
            <span id="totalCount">0</span> <span data-i18n="claims">claims</span>
          </div>
          <button class="btn-clear-all" id="clearAllBtn" data-i18n="clear_all">Clear All</button>
        </div>
      </div>
      <div class="channel-list" id="channelList">
        <div class="no-data" data-i18n="no_channels">No claims yet</div>
      </div>
    </div>

    </div>
  </div>

  <div class="footer">
    <span class="footer-text">Made with <span>♥</span> by 狐狐</span>
    <div class="footer-right">
      <button class="btn-settings" id="settingsBtn" title="Settings">⚙️</button>
      <span class="version">v1.0.5</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 300px;
      padding: 0;
      background: #0d0d0f;
      color: #f5f5f5;
      overflow: hidden;
    }

    /* Header with gradient */
    .header {
      background: linear-gradient(135deg, #1a1a1f 0%, #0d0d0f 100%);
      padding: 20px 20px 16px;
      border-bottom: 1px solid rgba(255, 169, 77, 0.15);
      position: relative;
    }

    .header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #ff9a4d, #ffb347, #ff6b35);
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #ff9a4d 0%, #ff6b35 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 2px 8px rgba(255, 107, 53, 0.3);
    }

    h1 {
      font-size: 17px;
      font-weight: 700;
      background: linear-gradient(90deg, #ff9a4d, #ffb347);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.3px;
    }

    .tagline {
      font-size: 11px;
      color: #666;
      margin-left: 42px;
    }

    /* Main content */
    .content {
      padding: 20px;
    }

    /* Status card */
    .status-card {
      background: linear-gradient(145deg, #1a1a1f 0%, #151518 100%);
      border: 1px solid rgba(255, 169, 77, 0.1);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .status-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #333;
      transition: all 0.3s ease;
    }

    .status-dot.active {
      background: #4ade80;
      box-shadow: 0 0 8px rgba(74, 222, 128, 0.5);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-text {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Toggle row */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .toggle-title {
      font-size: 14px;
      font-weight: 600;
      color: #f5f5f5;
    }

    .toggle-desc {
      font-size: 11px;
      color: #555;
    }

    .toggle {
      position: relative;
      width: 48px;
      height: 28px;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #2a2a2f;
      border-radius: 28px;
      transition: 0.3s;
      border: 1px solid #333;
    }

    .toggle-slider::before {
      position: absolute;
      content: '';
      height: 22px;
      width: 22px;
      left: 2px;
      bottom: 2px;
      background: #555;
      border-radius: 50%;
      transition: 0.3s;
    }

    .toggle input:checked + .toggle-slider {
      background: linear-gradient(135deg, #ff9a4d 0%, #ff6b35 100%);
      border-color: #ff9a4d;
      box-shadow: 0 0 12px rgba(255, 107, 53, 0.3);
    }

    .toggle input:checked + .toggle-slider::before {
      transform: translateX(20px);
      background: #fff;
    }

    /* Info section */
    .info-section {
      background: rgba(255, 169, 77, 0.05);
      border: 1px solid rgba(255, 169, 77, 0.1);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .info-title {
      font-size: 11px;
      color: #ff9a4d;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .info-text {
      font-size: 12px;
      color: #888;
      line-height: 1.5;
    }

    /* Footer */
    .footer {
      padding: 14px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-text {
      font-size: 11px;
      color: #444;
    }

    .footer-text span {
      color: #ff9a4d;
    }

    .version {
      font-size: 10px;
      color: #333;
      background: #1a1a1f;
      padding: 4px 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-row">
      <div class="logo">🦊</div>
      <h1>Twitch Auto Claimer</h1>
    </div>
    <p class="tagline">懶人必備・自動領獎</p>
  </div>

  <div class="content">
    <div class="status-card">
      <div class="status-header">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">等待中</span>
      </div>
      <div class="toggle-row">
        <div class="toggle-label">
          <span class="toggle-title">自動領取</span>
          <span class="toggle-desc">偵測到獎勵時自動點擊</span>
        </div>
        <label class="toggle">
          <input type="checkbox" id="toggleSwitch" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div class="info-section">
      <div class="info-title">使用提示</div>
      <p class="info-text">
        開啟開關後，獎勵按鈕出現時會自動點擊領取。懶人必備！
      </p>
    </div>
  </div>

  <div class="footer">
    <span class="footer-text">Made with <span>♥</span> by 狐狐</span>
    <span class="version">v15</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
